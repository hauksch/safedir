version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      action-deps:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain is pinned to the workspace MSRV, not to the
      # latest Rust release — bumping it would silently defeat the check.
      - dependency-name: "dtolnay/rust-toolchain"

